name: Tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU PyTorch
        run: grep -E '^torch' requirements.txt | python -m pip install -r /dev/stdin --index-url https://download.pytorch.org/whl/cpu
      - name: Install core and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests without simulator or model downloads
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          CUDA_VISIBLE_DEVICES: ''
        run: python -m pytest tests/ -q
